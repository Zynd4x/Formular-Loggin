<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <script src="./js/index.js" defer></script> 
    <title>Login</title>
</head>
<body>
<main>
  <div class="flipping-cards">
    <!-- Unsichtbare Steuerung per Checkbox -->
    <input type="checkbox" id="card-toggle" class="card-toggle-input">

    <div class="wrapper">
      <!-- VORDERSEITE: Sign Up / Account Erstellen -->
      <div id="creatAccount-form" class="creatAccount-form front">
        <section class="innerCircle">
          <h1>Sign Up</h1>
          <h2>Create Account</h2>
          <form>
            <div>

              <input type="text" name="username" id="signup-username" placeholder="Username" required>
            </div>
            <div>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6.2679 3H17.7321C18.5449 2.99999 19.2006 2.99999 19.7315 3.04336C20.2781 3.08803 20.7582 3.18239 21.2025 3.40873C21.9081 3.76825 22.4817 4.34193 22.8413 5.04754C22.9352 5.23189 23.0064 5.42243 23.0608 5.62134C23.0825 5.70086 23.0934 5.74061 23.0893 5.78546C23.086 5.82285 23.0716 5.86521 23.0515 5.89691C23.0274 5.93495 22.9911 5.96249 22.9186 6.01757L13.4806 13.1834C12.7334 13.7507 12.5236 13.8928 12.3201 13.9469C12.1097 14.0028 11.8884 14.0028 11.678 13.9469C11.4744 13.8928 11.2647 13.7507 10.5175 13.1834L1.08112 6.0188C1.0086 5.96374 0.97234 5.9362 0.948235 5.89819C0.928141 5.86649 0.913755 5.82415 0.910383 5.78678C0.906337 5.74195 0.917182 5.70219 0.938873 5.62269C0.993271 5.42329 1.06458 5.23231 1.15873 5.04754C1.51825 4.34193 2.09193 3.76825 2.79754 3.40873C3.24175 3.18239 3.7219 3.08803 4.26853 3.04336C4.79944 2.99999 5.45507 2.99999 6.2679 3Z" fill="currentColor"/><path d="M1.38704 8.13444C1.18389 7.98019 1.08231 7.90307 0.995849 7.90451C0.92093 7.90576 0.849748 7.94108 0.803449 8C0.750014 8.06799 0.750009 8.19512 0.750001 8.44939C0.75 8.4721 0.75 8.49493 0.75 8.51789V15.4821C0.749993 16.2949 0.749987 16.9506 0.793364 17.4815C0.838026 18.0281 0.932385 18.5082 1.15873 18.9525C1.51825 19.6581 2.09193 20.2317 2.79754 20.5913C3.24175 20.8176 3.7219 20.912 4.26853 20.9566C4.79944 21 5.45505 21 6.26788 21H17.7321C18.545 21 19.2006 21 19.7315 20.9566C20.2781 20.912 20.7582 20.8176 21.2025 20.5913C21.9081 20.2317 22.4817 19.6581 22.8413 18.9525C23.0676 18.5082 23.162 18.0281 23.2066 17.4815C23.25 16.9506 23.25 16.295 23.25 15.4821V8.51788C23.25 8.49442 23.25 8.47109 23.25 8.44789C23.25 8.19364 23.25 8.06651 23.1966 7.99852C23.1503 7.9396 23.0791 7.90428 23.0042 7.90303C22.9177 7.90159 22.8161 7.97871 22.613 8.13295L14.2815 14.4588C13.6937 14.906 13.2333 15.2563 12.7054 15.3966C12.2425 15.5196 11.7556 15.5196 11.2927 15.3966C10.7648 15.2563 10.3044 14.906 9.71661 14.4588L1.38704 8.13444Z" fill="currentColor"/></svg>
              <input type="email" name="email" id="signup-email" class="email" placeholder="Email" required>
            </div>
            <div>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M18.75 8V10.1C18.31 10.04 17.81 10.01 17.25 10V8C17.25 4.85 16.36 2.75 12 2.75C7.64 2.75 6.75 4.85 6.75 8V10C6.19 10.01 5.69 10.04 5.25 10.1V8C5.25 5.1 5.95 1.25 12 1.25C18.05 1.25 18.75 5.1 18.75 8Z" fill="currentColor"/><path d="M18.75 10.1C18.31 10.04 17.81 10.01 17.25 10H6.75C6.19 10.01 5.69 10.04 5.25 10.1C2.7 10.41 2 11.66 2 15V17C2 21 3 22 7 22H17C21 22 22 21 22 17V15C22 11.66 21.3 10.41 18.75 10.1ZM8.71 16.71C8.52 16.89 8.26 17 8 17C7.87 17 7.74 16.97 7.62 16.92C7.49 16.87 7.39 16.8 7.29 16.71C7.11 16.52 7 16.26 7 16C7 15.87 7.03 15.74 7.08 15.62C7.13 15.5 7.2 15.39 7.29 15.29C7.39 15.2 7.49 15.13 7.62 15.08C7.99 14.92 8.43 15.01 8.71 15.29C8.8 15.39 8.87 15.5 8.92 15.62C8.97 15.74 9 15.87 9 16C9 16.26 8.89 16.52 8.71 16.71ZM12.92 16.38C12.87 16.5 12.8 16.61 12.71 16.71C12.52 16.89 12.26 17 12 17C11.73 17 11.48 16.89 11.29 16.71C11.2 16.61 11.13 16.5 11.08 16.38C11.03 16.26 11 16.13 11 16C11 15.73 11.11 15.48 11.29 15.29C11.66 14.92 12.33 14.92 12.71 15.29C12.89 15.48 13 15.73 13 16C13 16.13 12.97 16.26 12.92 16.38ZM16.71 16.71C16.52 16.89 16.26 17 16 17C15.74 17 15.48 16.89 15.29 16.71C15.11 16.52 15 16.27 15 16C15 15.73 15.11 15.48 15.29 15.29C15.67 14.92 16.34 14.92 16.71 15.29C16.75 15.34 16.79 15.39 16.83 15.45C16.87 15.5 16.9 15.56 16.92 15.62C16.95 15.68 16.97 15.74 16.98 15.8C16.99 15.87 17 15.94 17 16C17 16.26 16.89 16.52 16.71 16.71Z" fill="currentColor"/></svg>
              <input type="password" name="password" id="signup-password" minlength="10" maxlength="20" placeholder="Password" required>
            </div>
            <input type="submit" value="CREATE ACCOUNT" class="submit">
          </form>
          <div class="card-switch-prompt">
            <p>Already have an account? <label for="card-toggle" class="switch-btn">Sign In</label></p>
          </div>
        </section>
      </div>

      <!-- RÜCKSEITE: Login -->
      <div id="logIn-form" class="logIn-form back">
        <section class="innerCircle">
          <h1>Login</h1>
          <h2>Welcome Back</h2>
          <form>
            <div>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" fill="currentColor"/><path d="M12.0002 14.5C6.99016 14.5 2.91016 17.86 2.91016 22C2.91016 22.28 3.13016 22.5 3.41016 22.5H20.5902C20.8702 22.5 21.0902 22.28 21.0902 22C21.0902 17.86 17.0102 14.5 12.0002 14.5Z" fill="currentColor"/></svg>
              <input type="text" name="username" id="login-username" placeholder="Username" required>
            </div>
            <div>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M18.75 8V10.1C18.31 10.04 17.81 10.01 17.25 10V8C17.25 4.85 16.36 2.75 12 2.75C7.64 2.75 6.75 4.85 6.75 8V10C6.19 10.01 5.69 10.04 5.25 10.1V8C5.25 5.1 5.95 1.25 12 1.25C18.05 1.25 18.75 5.1 18.75 8Z" fill="currentColor"/><path d="M18.75 10.1C18.31 10.04 17.81 10.01 17.25 10H6.75C6.19 10.01 5.69 10.04 5.25 10.1C2.7 10.41 2 11.66 2 15V17C2 21 3 22 7 22H17C21 22 22 21 22 17V15C22 11.66 21.3 10.41 18.75 10.1ZM8.71 16.71C8.52 16.89 8.26 17 8 17C7.87 17 7.74 16.97 7.62 16.92C7.49 16.87 7.39 16.8 7.29 16.71C7.11 16.52 7 16.26 7 16C7 15.87 7.03 15.74 7.08 15.62C7.13 15.5 7.2 15.39 7.29 15.29C7.39 15.2 7.49 15.13 7.62 15.08C7.99 14.92 8.43 15.01 8.71 15.29C8.8 15.39 8.87 15.5 8.92 15.62C8.97 15.74 9 15.87 9 16C9 16.26 8.89 16.52 8.71 16.71ZM12.92 16.38C12.87 16.5 12.8 16.61 12.71 16.71C12.52 16.89 12.26 17 12 17C11.73 17 11.48 16.89 11.29 16.71C11.2 16.61 11.13 16.5 11.08 16.38C11.03 16.26 11 16.13 11 16C11 15.73 11.11 15.48 11.29 15.29C11.66 14.92 12.33 14.92 12.71 15.29C12.89 15.48 13 15.73 13 16C13 16.13 12.97 16.26 12.92 16.38ZM16.71 16.71C16.52 16.89 16.26 17 16 17C15.74 17 15.48 16.89 15.29 16.71C15.11 16.52 15 16.27 15 16C15 15.73 15.11 15.48 15.29 15.29C15.67 14.92 16.34 14.92 16.71 15.29C16.75 15.34 16.79 15.39 16.83 15.45C16.87 15.5 16.9 15.56 16.92 15.62C16.95 15.68 16.97 15.74 16.98 15.8C16.99 15.87 17 15.94 17 16C17 16.26 16.89 16.52 16.71 16.71Z" fill="currentColor"/></svg>
              <input type="password" name="password" id="login-password" placeholder="Password" required>
            </div>
            <div class="switchLane">
              <label class="switch">
                <input type="checkbox" id="remember-me">
                <span class="slider round"></span>
              </label>
              <h3>Remember me</h3>
              <a href="#" class="forgotPw" id="forgot-password-link">Forgot password?</a>
            </div>
            <input type="submit" value="SIGN IN" class="submit">
          </form>
          <div id="reset-modal" class="modal-overlay hidden">
            <div class="modal-content card">
              <h3>Reset Password</h3>
              <p>Geben Sie Ihre Email-Adresse ein. Wir senden Ihnen einen Link zum Zurücksetzen.</p>

              <form id="forgot-password-form">
                <div class="input-group">
                  <input type="email" id="reset-email" placeholder="Email Adresse" required>
                </div>
                <div class="modal-actions">
                  <button type="submit" class="btn">Link anfordern</button>
                  <button type="button" id="cloase-modal-btn" class="btn-secondary">Abbrechen</button>
                </div>
              </form>
            </div>
          </div>
          <div class="card-switch-prompt">
            <p>Don't have an account? <label for="card-toggle" class="switch-btn">Sign Up</label></p>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
</body>
</html>
