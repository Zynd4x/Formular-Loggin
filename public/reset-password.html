<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="./js/reset-password.js"></script>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <main>
        <div class="resetPassword-form">
            <section class="innerCircle">
                <h1>Reset Password</h1>
                <form id="reset-password-form">
                    <div>
                        <label for="new-password"></label>
                        <input type="password" name="new-password" id="new-password" placeholder="New Password" required>
                    </div>
                    <div>
                        <label for="new-password-verify"></label>
                        <input type="password" name="new-password-verify" id="new-password-verify" placeholder="Repeat Password" required>
                    </div>
                    <button type="submit" class="submit">Senden</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
