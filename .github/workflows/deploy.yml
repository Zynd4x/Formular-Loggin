name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"] # Passe den Branch an, falls er bei dir 'master' heißt

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Hier trägst du den Pfad zu deinem Unterordner ein:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions-deploy-pages@v4